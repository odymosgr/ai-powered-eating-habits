<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" width="640" height="190" role="img" aria-label="Start of Onboarding: three cards, Build Muscle with a flexed arm, Lose Fat with a slim unisex silhouette, Improve Eating Habits with a smiley face (probably)">
<title>Start of Onboarding: three cards, Build Muscle with a flexed arm, Lose Fat with a slim unisex silhouette, Improve Eating Habits with a smiley face (probably)</title>
<defs>
