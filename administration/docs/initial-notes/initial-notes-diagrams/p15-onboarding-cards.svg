<rect x="0.5" y="0.5" width="639" height="189" rx="10" fill="#fffef8" stroke="#e5e7eb"/>
<rect x="20" y="20" width="120" height="100" rx="12" class="box"/>
<text x="36" y="46"><tspan x="36" dy="0">Build</tspan><tspan x="36" dy="18">Muscle</tspan></text>
<path d="M60,106 L92,106 Q100,92 92,82 Q86,74 80,82 L78,88 Q70,80 62,90 Z" class="ln"/>
