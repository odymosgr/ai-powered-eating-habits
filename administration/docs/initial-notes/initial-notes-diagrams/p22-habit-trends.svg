<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 492" width="740" height="492" role="img" aria-label="Habit Trends: Week X analysis with main habits, arrow to Week X+1, and the four possible habit changes">
<title>Habit Trends: Week X analysis with main habits, arrow to Week X+1, and the four possible habit changes</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1e40af"/>
  </marker>
</defs>
<style>
  text { font-family: Helvetica, Arial, sans-serif; fill: #1e40af; font-size: 14px; }
  .s { font-size: 12px; }
  .b { font-weight: bold; }
  .g { fill: #9ca3af; }
  .ln { fill: none; stroke: #1e40af; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .box { fill: none; stroke: #1e40af; stroke-width: 1.6; }
  .dot { fill: none; stroke: #1e40af; stroke-width: 1.3; stroke-dasharray: 2 4; stroke-linecap: round; }
  .struck { fill: none; stroke: #9ca3af; stroke-width: 1.4; stroke-dasharray: 5 4; }
</style>
<rect x="0.5" y="0.5" width="739" height="491" rx="10" fill="#fffef8" stroke="#e5e7eb"/>
<text x="30" y="36" class="b"><tspan x="30" dy="0">Habit Trends</tspan></text>
<text x="170" y="36"><tspan x="170" dy="0">(Goal dependent analysis)</tspan></text>
<text x="40" y="76"><tspan x="40" dy="0">Week X</tspan></text>
<rect x="40" y="86" width="110" height="56" rx="4" class="box"/>
<text x="50" y="102" class="s"><tspan x="50" dy="0">Analysis</tspan></text>
<path d="M190,114 L370,114" class="ln" marker-end="url(#arr)"/>
<text x="390" y="76"><tspan x="390" dy="0">Week X+1</tspan></text>
<rect x="390" y="86" width="110" height="56" rx="4" class="box"/>
<text x="40" y="170" class="s"><tspan x="40" dy="0">Main Habits</tspan><tspan x="40" dy="16">1 …</tspan><tspan x="40" dy="16">2 …</tspan><tspan x="40" dy="16">…</tspan></text>
<text x="390" y="170" class="s"><tspan x="390" dy="0">1′ …</tspan><tspan x="390" dy="16">2′</tspan><tspan x="390" dy="16">3′</tspan><tspan x="390" dy="16">…</tspan></text>
<path d="M70,248 L70,228" class="ln" marker-end="url(#arr)"/>
<text x="40" y="268" class="s"><tspan x="40" dy="0">Each one with a</tspan><tspan x="40" dy="17">usefulness score</tspan><tspan x="40" dy="17">defining Good / Bad</tspan><tspan x="40" dy="17">according to the user's</tspan><tspan x="40" dy="17">Goals at the time</tspan><tspan x="40" dy="17"></tspan><tspan x="40" dy="17">→ Trend Analysis is</tspan><tspan x="40" dy="17">goal dependent and</tspan><tspan x="40" dy="17">requires multiple</tspan><tspan x="40" dy="17">weeks</tspan></text>
<path d="M205,268 L205,470 L720,470" class="ln"/>
<text x="230" y="168" class="s"><tspan x="230" dy="0">Possible Habit</tspan><tspan x="230" dy="16">Changes:</tspan></text>
<path d="M255,190 L255,250 L290,250" class="ln"/>
<text x="300" y="254"><tspan x="300" dy="0">• Same Habit (usefulness stable ~)</tspan></text>
<text x="300" y="284"><tspan x="300" dy="0">• Changed Habit (big change in usefulness)</tspan></text>
<rect x="300" y="296" width="410" height="76" rx="2" class="box"/>
<text x="310" y="314" class="s"><tspan x="310" dy="0">General habit-defining trigger stays the same, but the detailed</tspan><tspan x="310" dy="16">description has probably changed. For example, trigger: “when I</tspan><tspan x="310" dy="16">have cravings at home”, old version “I eat sweets”, new version</tspan><tspan x="310" dy="16">“I eat fruit”</tspan></text>
<text x="300" y="404"><tspan x="300" dy="0">• Eliminated old habit (Trendline stops)</tspan></text>
<text x="300" y="434"><tspan x="300" dy="0">• Emerged new habit (New Trendline)</tspan></text>
</svg>
