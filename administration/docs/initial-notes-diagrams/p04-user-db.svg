<rect x="0.5" y="0.5" width="419" height="115" rx="10" fill="#fffef8" stroke="#e5e7eb"/>
<text x="20" y="62" class="b"><tspan x="20" dy="0">User DB:</tspan></text>
<text x="110" y="62"><tspan x="110" dy="0">meals  @</tspan></text>
<text x="185" y="62"><tspan x="185" dy="0">Conditions</tspan></text>
<text x="330" y="62"><tspan x="330" dy="0">/ per day</tspan></text>
