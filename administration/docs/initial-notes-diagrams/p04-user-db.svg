<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 116" width="420" height="116" role="img" aria-label="User DB: meals @ Conditions (probable reward, time, environment) per day">
<title>User DB: meals @ Conditions (probable reward, time, environment) per day</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1e40af"/>
  </marker>
</defs>
<style>
  text { font-family: Helvetica, Arial, sans-serif; fill: #1e40af; font-size: 14px; }
  .s { font-size: 12px; }
  .b { font-weight: bold; }
  .g { fill: #9ca3af; }
  .ln { fill: none; stroke: #1e40af; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .box { fill: none; stroke: #1e40af; stroke-width: 1.6; }
  .dot { fill: none; stroke: #1e40af; stroke-width: 1.3; stroke-dasharray: 2 4; stroke-linecap: round; }
