<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 478" width="720" height="478" role="img" aria-label="Three diet options bracketed, leading to appropriate wording per user, leading to a beyond-MVP note on a per-user md file">
<title>Three diet options bracketed, leading to appropriate wording per user, leading to a beyond-MVP note on a per-user md file</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1e40af"/>
  </marker>
</defs>
<style>
  text { font-family: Helvetica, Arial, sans-serif; fill: #1e40af; font-size: 14px; }
  .s { font-size: 12px; }
  .b { font-weight: bold; }
  .g { fill: #9ca3af; }
  .ln { fill: none; stroke: #1e40af; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .box { fill: none; stroke: #1e40af; stroke-width: 1.6; }
  .dot { fill: none; stroke: #1e40af; stroke-width: 1.3; stroke-dasharray: 2 4; stroke-linecap: round; }
  .struck { fill: none; stroke: #9ca3af; stroke-width: 1.4; stroke-dasharray: 5 4; }
</style>
<rect x="0.5" y="0.5" width="719" height="477" rx="10" fill="#fffef8" stroke="#e5e7eb"/>
<text x="20" y="34"><tspan x="20" dy="0">In OB we should have defined if the user wants a</tspan></text>
<text x="40" y="62"><tspan x="40" dy="0">– “calorie surplus” / “lean bulk”</tspan><tspan x="40" dy="24">– “calorie deficit” / “leaning phase” / “cut” / “fat loss”</tspan><tspan x="40" dy="24">– calorie maintenance (“stable” / “maingaining”)</tspan></text>
<text x="20" y="136"><tspan x="20" dy="0">diet.</tspan></text>
<path d="M420,44 Q440,44 440,62 L440,84 Q440,92 450,94 Q440,96 440,104 L440,126 Q440,144 420,144" class="ln"/>
<path d="M452,94 C490,94 490,140 470,170" class="ln" marker-end="url(#arr)"/>
<path d="M400,176 L400,330" class="ln"/>
<text x="412" y="192" class="s"><tspan x="412" dy="0">Appropriate wording depending on user.</tspan><tspan x="412" dy="17">Probably selected from a predefined</tspan><tspan x="412" dy="17">table of alternatives and connected to</tspan><tspan x="412" dy="17">user data, so the AI can use it as the</tspan><tspan x="412" dy="17">preferred way when talking to the user.</tspan><tspan x="412" dy="17">If / when user goals change, this</tspan><tspan x="412" dy="17">should also change</tspan></text>
<path d="M470,318 L470,352" class="ln" marker-end="url(#arr)"/>
<rect x="400" y="356" width="300" height="104" rx="2" class="box"/>
<text x="412" y="378" class="s"><tspan x="412" dy="0">Beyond MVP: Define user archetypes with</tspan><tspan x="412" dy="17">related words for a more familiar</tspan><tspan x="412" dy="17">communication. … Actually an md short</tspan><tspan x="412" dy="17">file per user, defining the way the AI</tspan><tspan x="412" dy="17">speaks, should be enough.</tspan></text>
</svg>
